<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Mechanic: Hop Level Up!</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-dark: #0d1117;
            --accent-blue: #58a6ff;
            --accent-gold: #f1e05a;
            --text-light: #c9d1d9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(241, 224, 90, 0.3);
        }

        .tagline {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Interactive Preview Sandbox */
        .game-preview {
            background: radial-gradient(circle, #1f2937 0%, #111827 100%);
            border: 3px solid var(--accent-blue);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .star-token {
            font-size: 5rem;
            display: inline-block;
            transition: transform 0.1s ease;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, top: 0px;
            50% { transform: translateY(-15px) rotate(5deg); }
            100% { top: 0px; }
        }

        .star-token:active {
            transform: scale(0.85);
        }

        .ui-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .stat {
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-cta {
            background-color: #238636;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
            transition: transform 0.2s, background-color 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-cta:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
        }

        .hint {
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Star Mechanic</h1>
        <p class="tagline">Bounce, level up, and unlock the paths to victory in this vibrant, rhythm-fueled arcade puzzle runner!</p>

        <!-- Tap-to-test Demo Section -->
        <div class="game-preview" id="gameBox">
            <div class="star-token" id="starPlayer">⭐</div>
            <p class="hint">👇 TAP THE STAR TO TEST MECHANICS 👇</p>
            
            <div class="ui-bar">
                <div class="stat">SCORE: <span id="scoreVal">0</span></div>
                <div class="stat">LEVEL: <span id="levelVal">1</span></div>
            </div>
        </div>

        <a href="#" class="btn-cta">Pre-Register Now</a>
    </div>

    <script>
        const star = document.getElementById('starPlayer');
        const scoreVal = document.getElementById('scoreVal');
        const levelVal = document.getElementById('levelVal');
        
        let score = 0;
        let level = 1;

        star.addEventListener('click', () => {
            score += 10;
            scoreVal.innerText = score;
            
            // Squash and stretch effect
            star.style.transform = 'scale(1.3) rotate(-10deg)';
            setTimeout(() => {
                star.style.transform = 'scale(1) rotate(0deg)';
            }, 100);

            // Level Up logic every 50 points
            if (score % 50 === 0) {
                level++;
                levelVal.innerText = level;
                
                // Shoot celebration confetti instantly
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#f1e05a', '#58a6ff', '#2ea043']
                });
            }
        });
    </script>
</body>
</html>
